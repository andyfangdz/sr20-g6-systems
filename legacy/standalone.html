<title>SR20 G6 Systems</title>
<meta name="description" content="Interactive 3D walkthrough of the Cirrus SR20 (Perspective+) airplane systems from POH Section 7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#E6EBEE; --panel:#F5F7F8; --panel2:#EDF1F3; --ink:#14202A; --muted:#566570; --rule:#CBD4DA;
  --accent:#1B5E88; --scene:#DCE3E7; --grid:#B9C4CB; --shell:#2A3B48;
  --elec:#D9960F; --fuel:#2F7FE6; --oil:#B85A2A; --air:#149C94; --hot:#E0522B; --ctrl:#7C57CF;
  --pitot:#3A9448; --caps:#D32640; --avx:#C8399F; --cabin:#6F7F8C; --gear:#5C6E7E; --frame:#3D5A73;
  --warn:#E0263B; --caut:#E7B416; --adv:#F2F5F7; --cas-bg:#05080B;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1117; --panel:#111A21; --panel2:#16212A; --ink:#E0E7EC; --muted:#8B9AA6; --rule:#24323D;
    --accent:#63B4E6; --scene:#0C141B; --grid:#1D2A34; --shell:#9FB6C8; --frame:#8FB0CC;
    --cabin:#9AA8B3; --gear:#8C9DAC;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1117; --panel:#111A21; --panel2:#16212A; --ink:#E0E7EC; --muted:#8B9AA6; --rule:#24323D;
  --accent:#63B4E6; --scene:#0C141B; --grid:#1D2A34; --shell:#9FB6C8; --frame:#8FB0CC;
  --cabin:#9AA8B3; --gear:#8C9DAC;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:228px minmax(0,1fr) 392px;height:100%;min-height:0}
/* ---------- rail ---------- */
.rail{border-right:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;margin:6px 0 4px;letter-spacing:.01em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.syslist{list-style:none;margin:0;padding:8px 8px 16px;overflow:auto;flex:1}
.syslist button{width:100%;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;
  background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.syslist button:hover{background:var(--panel2)}
.syslist button[aria-current="true"]{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
.syslist .sw{width:10px;height:10px;border-radius:2px;background:var(--c)}
.syslist .nm{font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.syslist .pg{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail .foot{padding:12px 18px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

/* ---------- viewport ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--scene);overflow:hidden}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--f-mono);font-size:11px;
  padding:3px 6px;border-radius:3px;background:var(--panel);color:var(--ink);border:1px solid var(--c);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:var(--c)}
.pin b{font-weight:500;color:var(--c)}
.pin{margin-top:-10px}
.tip{position:absolute;pointer-events:none;max-width:260px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;
  font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
.tip h4{margin:0 0 2px;font-family:var(--f-disp);font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.tip p{margin:0;color:var(--muted)}
.toolbar{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:5px 9px;font-family:var(--f-mono);font-size:11px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.04em}
.tb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#tbTheme{display:inline-flex;align-items:center;gap:5px}
#tbTheme .ico{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.hint{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);
  padding:4px 8px;border-radius:4px}
/* CAS window — deliberately always dark, like the display */
.cas{position:absolute;left:12px;bottom:12px;width:232px;background:var(--cas-bg);border:1px solid #2B3640;border-radius:4px;padding:6px 8px 7px;
  font-family:var(--f-mono);font-size:12px;color:#DDE5EA;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cas .hd{display:flex;justify-content:space-between;font-size:10px;color:#7E8E99;letter-spacing:.08em;margin-bottom:4px}
.cas ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cas li{padding:1px 5px;font-weight:500;letter-spacing:.03em}
.cas li.w{background:var(--warn);color:#fff}
.cas li.c{color:#10151A;background:var(--caut)}
.cas li.a{color:var(--adv)}
.cas .none{color:#5E6E79}
.caps-hud{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;min-width:200px}
.caps-hud b{font-family:var(--f-disp);font-size:22px;color:var(--caps);display:block;line-height:1.1}

/* ---------- panel ---------- */
.panel{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;min-height:0}
.panel-inner{padding:20px 22px 40px}
.ref{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.ref i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
.panel h2{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;margin:8px 0 10px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.lead{margin:0 0 16px;max-width:62ch}
.panel h3{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;
  padding-bottom:5px;border-bottom:1px solid var(--rule)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.notes{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.notes li::marker{color:var(--c)}
.caution{border-left:3px solid var(--caut);background:var(--panel2);padding:8px 10px;font-size:13.5px;margin:10px 0 0;border-radius:0 4px 4px 0}
.caution strong{font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase;font-size:13px;display:block}
/* controls */
.ctl{display:grid;gap:12px}
.row{display:grid;gap:5px}
.row > label,.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.row output{color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;background:var(--panel2);border:0;border-right:1px solid var(--rule);padding:7px 6px;cursor:pointer;font-family:var(--f-mono);font-size:12px;min-width:44px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}
input[type=range]{width:100%;accent-color:var(--c,var(--accent))}
.switches{display:flex;gap:6px;flex-wrap:wrap}
.rock{display:grid;justify-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0;width:56px}
.rock .body{width:30px;height:44px;border-radius:5px;background:#1A2127;position:relative;border:1px solid #394650}
.rock .body::after{content:"";position:absolute;left:3px;right:3px;height:20px;border-radius:3px;background:#56626B;top:21px;transition:top .12s}
.rock[aria-pressed="true"] .body::after{top:3px;background:#C9D2D8}
.rock span{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--c,var(--accent));width:16px;height:16px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--rule);border-radius:5px;padding:6px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--c,var(--accent))}
.btn.primary{background:var(--c,var(--accent));border-color:transparent;color:#fff}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.ro{background:var(--panel2);padding:7px 9px}
.ro span{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.ro b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.ro b.bad{color:var(--warn)} .ro b.warnc{color:#B98A00}
.buses{display:grid;gap:6px}
.bus{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;background:var(--panel2)}
.bus .top{display:flex;align-items:center;gap:8px}
.lamp{width:9px;height:9px;border-radius:50%;background:#56616A;flex:none}
.bus.on .lamp{background:var(--elec);box-shadow:0 0 6px var(--elec)}
.bus .nm{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em}
.bus .v{margin-left:auto;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.bus .src{font-size:12px;color:var(--muted);margin:1px 0 5px 17px}
.bus .loads{display:flex;flex-wrap:wrap;gap:4px;margin-left:17px}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:2px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);text-decoration:line-through;opacity:.7}
.bus.on .chip{color:var(--ink);text-decoration:none;opacity:1;border-color:color-mix(in srgb,var(--elec) 55%,var(--rule))}
button.chip{font:inherit;font-family:var(--f-mono);font-size:10.5px;background:none;cursor:pointer}
button.chip:hover{border-color:var(--elec)}
.chip.pulled,.bus.on .chip.pulled{background:repeating-linear-gradient(90deg,#fff 0 3px,#d7dde1 3px 6px);color:#6b1f26;text-decoration:line-through;opacity:1;border-color:#c8313b}
.chip.pulled::after{content:" ⏏";}
.mcu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcu .bus .src{margin-left:0}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.parts button{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:5px 8px;cursor:pointer;display:grid;gap:1px}
.parts button:hover{border-color:var(--rule);background:var(--panel2)}
.parts b{font-weight:600;font-size:14px}
.parts span{font-size:13px;color:var(--muted)}
.lights3{display:flex;gap:10px;margin-top:6px;font-family:var(--f-mono);font-size:11px}
.lights3 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4B555D;margin-right:5px;vertical-align:-1px}
.lights3 i.g{background:#2FD35A;box-shadow:0 0 6px #2FD35A} .lights3 i.y{background:#F2C12E;box-shadow:0 0 6px #F2C12E}
.small{font-size:12.5px;color:var(--muted)}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.overview-grid button{text-align:left;border:1px solid var(--rule);background:var(--panel2);border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.overview-grid button:hover{border-color:var(--c)}
.overview-grid b{font-family:var(--f-disp);font-size:16px;text-transform:uppercase;letter-spacing:.03em;color:var(--c)}
.overview-grid span{font-size:12.5px;color:var(--muted)}
.disc{margin-top:26px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}

@media (max-width:1100px){ .app{grid-template-columns:200px minmax(0,1fr) 340px} }
@media (max-width:860px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .brand{padding:14px 16px 10px}
  .brand h1{font-size:26px}
  .syslist{display:flex;overflow-x:auto;padding:6px 10px 10px;gap:4px}
  .syslist li{flex:none}
  .syslist button{grid-template-columns:10px auto;padding:6px 10px;border:1px solid var(--rule)}
  .syslist .pg{display:none}
  .syslist .nm{font-size:15px}
  .rail .foot{display:none}
  .stage{height:58vh;min-height:340px}
  .panel{border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .panel-inner{padding:18px 16px 40px}
  .cas{width:200px;font-size:11px}
  .hint{display:none}
  .caps-hud{min-width:0}
}
@media (prefers-reduced-motion: reduce){ .rock .body::after{transition:none} }
</style>

<div class="app">

    </div>
    <ul class="syslist" id="syslist"></ul>

  </nav>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="3D model of the SR20 and its systems"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const T = THREE, V = (x,y,z)=>new T.Vector3(x,y,z);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, D2R=Math.PI/180;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

/* =========================================================
   SIMULATION STATE
   ========================================================= */
const S = {
  sys:'overview',
  xray:true, labels:true,
  eng:{running:true, key:'BOTH', lever:0.72, mix:0.85, altAir:false, crankT:0, starve:0, rpm:2500, startTimer:0},
  elec:{bat1:true, bat2:true, alt1:true, alt2:true, avionics:true, fail:{alt1:false, alt2:false, bat1:false}, tBat:0},
  cb:{},   // pulled circuit breakers, keyed by breaker label
  fuel:{sel:'L', boost:false, qL:24, qR:22},
  flaps:{cmd:0, ang:0},
  ctrl:{pitch:0, roll:0, yaw:0},
  gear:{diff:0, park:false},
  env:{fan:1, temp:0.35, vent:'PF', ac:false, recirc:false},   // fan: -1 OFF, 0 ram air, 1-3 blower
  pitot:{heat:true, oat:8, heaterFail:false, alt:false},
  stall:{aoa:6, fault:false},
  lights:{cabin:'AUTO', door:false, unlocked:false, bag:false},
  avx:{backup:false, pfdFail:false},
  caps:{t:-1, playing:false},
  focus:null
};

/* ---------- electrical solver (POH §7 Power Distribution) ----------
   Diode-ORed distribution buses in the MCU; CB-panel buses hang off them. Pulled breakers
   (S.cb) remove individual loads. Battery endurance uses the Costanzo training deck's rule
   of thumb: ALT 1 fail → BAT 1 carries MDB 1 ~30 min; dual ALT fail → BAT 1 ~15 min, then BAT 2 ~45 min. */
let E = {};
const cb = name => !S.cb[name];
function solveElec(){
  const e=S.elec, run=S.eng.running, t=e.tBat;
  const alt1 = run && e.alt1 && !e.fail.alt1 && e.bat1 && cb('ALT 1');               // ALT 1 field needs BAT 1 on
  const alt2 = run && e.alt2 && !e.fail.alt2 && (e.bat1 || e.bat2) && cb('ALT 2');    // ALT 2 field from ESS BUS 2
  const bat1Life = alt2 ? 30 : 15;
  const bat1Dead = e.fail.bat1 || (run && !alt1 && e.bat1 && t >= bat1Life);
  const bat2Dead = run && !alt1 && !alt2 && t >= 60;
  const bat1ok = e.bat1 && !bat1Dead;
  const bat2ok = e.bat2 && !bat2Dead && cb('BAT 2');
  const D=0.7;                                                   // diode drop
  const mdb1 = Math.max(alt1?27.7:0, bat1ok?24.3:0);
  const mdb2 = Math.max(alt2?28.7:0, mdb1 ? mdb1-D : 0);         // MDB1 → MDB2 only
  const edb  = Math.max(mdb1, mdb2) ? Math.max(mdb1, mdb2)-D : 0;
  const ess  = Math.max(edb, bat2ok?24.2:0);
  const r = v => Math.round(v*10)/10;
  E = { alt1, alt2, bat1ok, bat2ok, bat1Dead, bat2Dead,
    mdb1:r(mdb1), mdb2:r(mdb2), edb:r(edb),
    ess1:r(ess), ess2:r(ess),
    main1:r(mdb2), main2:r(mdb2), nonEss:r(mdb2),
    main3:r(mdb1), ac1:r(mdb1), ac2:r(mdb1),
    avx: e.avionics && mdb2 && cb('AVIONICS') ? r(mdb2) : 0,
    conv: bat1Dead ? 0 : 24.4
  };
  E.bat1Charging = bat1ok && mdb1 > 26;
  E.bat2Charging = bat2ok && edb > 26;
  E.bat2Supplying = bat2ok && edb < 26;
  // illustrative currents (normal readout from the training deck: ALT1 +23, ALT2 +13, BAT1 +1)
  E.a1 = alt1 ? (alt2 ? 23 : 36) : 0;
  E.a2 = alt2 ? (alt1 ? 13 : 22) : 0;
  E.b1 = !bat1ok ? 0 : alt1 ? 1 : (alt2 ? -14 : -36);
  const pw=(bus,name)=>(E[bus]||0)>0 && cb(name);
  E.pfd = !S.avx.pfdFail && (pw('ess1','PFD A') || pw('main2','PFD B'));
  E.mfd = pw('main3','MFD A') || pw('main1','MFD B');
  E.stby = pw('ess1','STDBY ATTD A') || pw('main1','STDBY ATTD B');
  E.flapsPwr=pw('nonEss','FLAPS'); E.pitotPwr=pw('nonEss','PITOT HEAT'); E.stallPwr=pw('ess2','STALL WARNING');
  E.boostPwr=pw('main2','FUEL PUMP'); E.starterPwr=pw('nonEss','STARTER') && bat1ok;
  E.pitchTrim=pw('ess2','PITCH TRIM'); E.rollTrim=pw('ess2','ROLL TRIM');
  E.navPwr=pw('nonEss','NAV LIGHTS'); E.strobePwr=pw('nonEss','STROBE LIGHTS'); E.eisPwr=pw('ess2','ENGINE INSTR');
  E.convPwr=E.conv>0 && cb('CONV LIGHTS');
  return E;
}
const on = bus => (E[bus]||0) > 0;

/* ---------- engine logic ---------- */
function fuelAvail(){ const f=S.fuel; return f.sel!=='OFF' && (f.sel==='L'?f.qL:f.qR) > 0.05; }
function engineTick(dt){
  const g=S.eng;
  if(g.key==='START'){
    g.startTimer -= dt;
    const canCrank = E.starterPwr;
    if(canCrank && !g.running){ g.crankT += dt; if(g.crankT>1.3 && fuelAvail() && g.mix>0.05) g.running = true; }
    if(g.startTimer<=0){ g.key='BOTH'; g.crankT=0; refresh(); }
  }
  if(g.running && (g.key==='OFF' || g.mix<=0.05)){ g.running=false; refresh(); }
  if(g.running && !fuelAvail()){ g.starve+=dt; if(g.starve>3){ g.running=false; g.starve=0; refresh(); } } else g.starve=0;
  let target = 0;
  if(g.running){
    const L=g.lever;
    target = L<0.14 ? 700 + L/0.14*1750 : L<0.93 ? 2500 : 2500 + (L-0.93)/0.07*200;
    if(g.key==='L'||g.key==='R') target -= 60;
  } else if(g.key==='START' && E.starterPwr) target = 260;
  g.rpm = lerp(g.rpm, target, clamp(dt*(target>g.rpm?2.2:1.1),0,1));
  if(g.rpm<3) g.rpm=0;
}
function map(){ const g=S.eng; if(g.rpm<200) return 29.9; return +(11.5 + g.lever*17.8 - (g.altAir?0.6:0)).toFixed(1); }

/* ---------- CAS ---------- */
function casMessages(){
  const m=[], f=S.fuel;
  if(S.stall.aoa>=14 && !S.stall.fault && E.stallPwr) m.push(['w','STALL']);
  if(E.ess1 < 24.5) m.push(['w','ESS BUS']);
  if(f.qL+f.qR < 7) m.push(['w','FUEL QTY < 7 GAL TOTAL']);
  if(E.mdb1 < 24.5) m.push(['c','M BUS 1']);
  if(E.mdb2 < 24.5) m.push(['c','M BUS 2']);
  if(S.eng.running && !E.alt1) m.push(['c','ALT 1']);
  if(S.eng.running && !E.alt2) m.push(['c','ALT 2']);
  if(S.eng.running && S.elec.bat1 && !E.bat1Charging) m.push(['c','BAT 1']);
  if(f.qL<8.2 && f.qR<8.2) m.push(['c','FUEL LOW BOTH TANKS']);
  if(S.pitot.heat && (S.pitot.heaterFail || !E.pitotPwr)) m.push(['c','PITOT HEAT FAIL']);
  if(!S.pitot.heat && S.pitot.oat < 5) m.push(['c','PITOT HEAT REQD']);
  if(S.stall.fault) m.push(['c','STALL WARN FAIL']);
  if(S.gear.park) m.push(['c','PARK BRAKE SET']);
  if((f.qL<8.2) !== (f.qR<8.2)) m.push(['a', (f.qL<8.2?'L':'R')+' FUEL < 8.2 GAL']);
  if(S.fuel.boost && E.boostPwr) m.push(['a','FUEL PUMP ON']);
  if(S.avx.backup || S.avx.pfdFail) m.push(['a','DISPLAY BACKUP']);
  return m;
}
function renderCAS(){
  const m = E.pfd || E.mfd ? casMessages() : [];
  $('casCount').textContent = (E.pfd||E.mfd) ? m.length + (m.length===1?' msg':' msgs') : 'NO DISPLAY PWR';
  $('casList').innerHTML = m.length ? m.map(([c,t])=>`<li class="${c}">${t}</li>`).join('') : `<li class="none">${(E.pfd||E.mfd)?'No alerts':'—'}</li>`;
}

/* ---------- geometry helpers ---------- */
function loft(sections, {closed=true, caps=true}={}){
  const N=sections[0].length, M=sections.length, pos=[], idx=[];
  sections.forEach(r=>r.forEach(p=>pos.push(p.x,p.y,p.z)));
  const J = closed?N:N-1;
  for(let i=0;i<M-1;i++) for(let j=0;j<J;j++){
    const a=i*N+j, b=i*N+(j+1)%N, c=(i+1)*N+j, d=(i+1)*N+(j+1)%N;
    idx.push(a,c,b, b,c,d);
  }
  if(caps && closed){
    [0,M-1].forEach(i=>{
      const r=sections[i], c=new T.Vector3(); r.forEach(p=>c.add(p)); c.multiplyScalar(1/N);
      const ci=pos.length/3; pos.push(c.x,c.y,c.z);
      for(let j=0;j<N;j++){ idx.push(ci, i*N+j, i*N+(j+1)%N); }
    });
  }
  const g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function af(x,t,m){ // NACA 4-digit style; returns [upper, lower] as fraction of chord
  x=clamp(x,0,1);
  const yt=5*t*(0.2969*Math.sqrt(x)-0.126*x-0.3516*x*x+0.2843*x*x*x-0.1036*x*x*x*x);
  const p=0.4, yc = m===0?0 : (x<p ? m/(p*p)*(2*p*x-x*x) : m/((1-p)*(1-p))*((1-2*p)+2*p*x-x*x));
  return [yc+yt, yc-yt];
}
function afRing(c0,c1,t,m,n=16){
  const pts=[];
  for(let i=0;i<=n;i++){ const u=i/n, x=c0+(c1-c0)*(1-Math.cos((1-u)*Math.PI/2)); pts.push([x,af(x,t,m)[0]]); }
  for(let i=1;i<=n;i++){ const u=i/n, x=c0+(c1-c0)*(1-Math.cos(u*Math.PI/2)); pts.push([x,af(x,t,m)[1]]); }
  return pts;
}
// catmull-rom scalar interpolation over a table
function interp(tab, col, x){
  const xs=tab.map(r=>r[0]); let i=0;
  if(x>=xs[0]) return tab[0][col]; if(x<=xs[xs.length-1]) return tab[tab.length-1][col];
  while(i<xs.length-1 && !(x<=xs[i] && x>=xs[i+1])) i++;
  const p0=tab[Math.max(i-1,0)][col], p1=tab[i][col], p2=tab[i+1][col], p3=tab[Math.min(i+2,tab.length-1)][col];
  const t=(xs[i]-x)/(xs[i]-xs[i+1]);
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);
}

    const py=Math.sign(sn)*Math.pow(Math.abs(sn),2/n), pz=Math.sign(c)*Math.pow(Math.abs(c),2/n);

  const n=py>=0?NT:NB; const w=(hw-m)*(1-TUMBLE*Math.max(0,py));

function planeRing(x, s=0.98){ const r=fRing(x,s,40); const sh=new T.Shape(r.map(p=>new T.Vector2(p.z,p.y))); const g=new T.ShapeGeometry(sh); g.rotateY(Math.PI/2); g.translate(x,0,0); return g; }
// flat panel filling the fuselage section at x, clamped between y0..y1, extruded aft→fwd by depth
function sectionSlab(x, y0, y1, s, depth, xr=x){
  // Sutherland–Hodgman clip of the section outline to the band y0..y1
  const clipY=(poly,yc,keepAbove)=>{ const out=[]; for(let i=0;i<poly.length;i++){ const A=poly[i], B=poly[(i+1)%poly.length];
      const ina = keepAbove ? A.y>=yc : A.y<=yc, inb = keepAbove ? B.y>=yc : B.y<=yc;
      if(ina) out.push(A); if(ina!==inb){ const t=(yc-A.y)/(B.y-A.y); out.push(new T.Vector2(A.x+(B.x-A.x)*t, yc)); } } return out; };
  const pts=clipY(clipY(fRing(xr,s,72).map(p=>new T.Vector2(p.z,p.y)), y0, true), y1, false);
  const g=new T.ExtrudeGeometry(new T.Shape(pts),{depth,bevelEnabled:false}); g.rotateY(Math.PI/2); g.translate(x-depth/2,0,0); return g;
}

/* =========================================================
   FLOWS (pipes, wires, cables with moving particles)
   ========================================================= */
const flows=[];
class Flow{
  constructor(pts, sys, o={}){
    this.curve=new T.CatmullRomCurve3(pts.map(p=>Array.isArray(p)?V(...p):p.clone()), false, 'catmullrom', o.tension??0.3);
    this.len=this.curve.getLength(); this.sys=sys; this.ext=!!o.ext;
    this.color=o.color||colorOf(sys[0]); if(!o.color) this.colVar=colorVar(sys[0]);
    if(o.tube!==false){
      const g=new T.TubeGeometry(this.curve, Math.max(24,Math.round(this.len*28)), o.r||0.012, 6, false);
      this.tube=new T.Mesh(g, mats(this.color).on); this.tube.userData.col=this.color; model.add(this.tube);

function h(tag, attrs={}, html=''){ const e=document.createElement(tag); for(const k in attrs){ if(k==='on') for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]); else if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html) e.innerHTML=html; return e; }
const updaters=[];
function seg(parent, label, opts, get, set, id){
  const row=h('div',{class:'row'}); row.append(h('div',{class:'lbl'},`<span>${label}</span>`));

  opts.forEach(([v,t])=>{ const b=h('button',{type:'button',id:id+'-'+v, on:{click:()=>{ set(v); refresh(); }}},t); b.dataset.v=v; s.append(b); });
  row.append(s); parent.append(row);

}
function slider(parent,label,min,max,step,get,set,fmt,id){
  const row=h('div',{class:'row'}); const lab=h('label',{for:id},`<span>${label}</span>`); const out=h('output'); lab.append(out);
  const inp=h('input',{type:'range',min,max,step,id}); inp.value=get();
  inp.addEventListener('input',()=>{ set(+inp.value); refresh(true); });
  row.append(lab,inp); parent.append(row);
  updaters.push(()=>{ if(document.activeElement!==inp) inp.value=get(); out.textContent=fmt(get()); });
}
function check(parent,label,get,set,id){
  const l=h('label',{class:'chk'}); const i=h('input',{type:'checkbox',id}); i.addEventListener('change',()=>{ set(i.checked); refresh(); });
  l.append(i, document.createTextNode(label)); parent.append(l); updaters.push(()=>{ i.checked=!!get(); });
}
function rocker(parent,label,get,set){
  const b=h('button',{type:'button',class:'rock','aria-label':label},`<div class="body"></div><span>${label}</span>`);
  b.addEventListener('click',()=>{ set(!get()); refresh(); }); parent.append(b);
  updaters.push(()=>b.setAttribute('aria-pressed',String(!!get())));
}
function readouts(parent, items){ // items: [label, fn -> [text, cls]]
  const w=h('div',{class:'readouts'}); const cells=items.map(([l])=>{ const c=h('div',{class:'ro'},`<span>${l}</span><b></b>`); w.append(c); return c.querySelector('b'); });
  parent.append(w); updaters.push(()=>items.forEach(([,f],i)=>{ const r=f(); const [t,c]=Array.isArray(r)?r:[r,'']; cells[i].textContent=t; cells[i].className=c||''; }));
}
function facts(list){ return `<dl class="facts">${list.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`; }
function notes(list){ return `<ul class="notes">${list.map(n=>`<li>${n}</li>`).join('')}</ul>`; }
function caution(t,b){ return `<div class="caution"><strong>${t}</strong>${b}</div>`; }
function partsList(sys){
  const ps=parts.filter(p=>p.pin && p.sys.includes(sys) && p.name);
  const seen=new Set(); const ul=h('ul',{class:'parts'});
  ps.forEach(p=>{ if(seen.has(p.name)) return; seen.add(p.name);
    const b=h('button',{type:'button'},`<b>${p.name}</b><span>${p.note}</span>`);
    b.addEventListener('click',()=>focusPart(p)); const li=h('li'); li.append(b); ul.append(li); });
  return ul;
}

/* =========================================================
   STATE → 3D
   ========================================================= */
function bladeAngle(){ return 14 + S.eng.lever*20; }
function cabinLit(){
  const L=S.lights; if(!E.convPwr) return {dome:0,foot:0,step:0,bag:0};
  const trig = L.door || L.unlocked;
  if(L.cabin==='OFF') return {dome:0,foot:0,step:0,bag:0};
  if(L.cabin==='ON') return {dome:1,foot:1,step:trig?1:0,bag:L.bag?1:0};
  return {dome:trig?1:0,foot:trig?1:0,step:trig?1:0,bag:L.bag?1:0};
}
function applyFlows(){
  const run=S.eng.running;
  F.alt1.rate = E.alt1?1:0; F.alt2.rate = E.alt2?1:0;
  F.bat1.rate = !E.bat1ok?0 : E.bat1Charging?-0.6:1;
  F.cb.rate = (E.mdb1||E.mdb2)?1:0;
  F.bat2.rate = !S.elec.bat2?0 : E.bat2Charging?-0.6:1;
  const feed = run || (S.fuel.boost && E.boostPwr);
  const ok = fuelAvail();
  F.fuelL.rate = feed && ok && S.fuel.sel==='L' ? 1:0;
  F.fuelR.rate = feed && ok && S.fuel.sel==='R' ? 1:0;
  F.fuelMain.rate = feed && ok ? (S.fuel.boost?1.4:1):0;
  const inj = run && ok ? 1:0; cyls.forEach(c=>{ F['inj'+c.n].rate=inj; F['man'+c.n].rate=run?1:0; F['exh'+c.n].rate=run?1.2:0; });
  F.intake.rate = run && !S.eng.altAir ? 1:0; F.tailpipe.rate=run?1.2:0; F.oil.rate=run?0.7:0;
  const fan=S.env.fan, air = fan<0 ? 0 : fan===0 ? 0.45 : 0.6+fan*0.4;
  F.fresh.rate = air && !S.env.recirc ? air*(1-S.env.temp*0.8):0;
  F.hot.rate = air && !S.env.ac && run ? air*S.env.temp : 0;
  F.toMan.rate = air;
  ['panelL','panelR','armL','armR'].forEach(k=>F[k].rate=air);
  const floor = S.env.vent==='PF'||S.env.vent==='PFW', wind = S.env.vent==='PFW'||S.env.vent==='W';
  ['floorF','floorF2','floorR','floorR2'].forEach(k=>F[k].rate=floor?air:0);
  F.defrost.rate=F.defrost2.rate = wind?air:0;
  // air particle color by temperature
  const tc = S.env.ac ? new T.Color('#6EC9E6') : new T.Color('#5FC8F0').lerp(new T.Color('#FF7A3D'), S.env.temp);
  ['toMan','panelL','panelR','armL','armR','floorF','floorF2','floorR','floorR2','defrost','defrost2'].forEach(k=>F[k].pts.material.color.copy(tc));
  F.hot.pts.material.color.set('#FF7A3D'); F.fresh.pts.material.color.set('#5FC8F0');
  F.pitot.rate = 0.4; F.static.rate=F.static2.rate=0.4; F.stall.rate = S.stall.aoa>=14 && !S.stall.fault ? -1 : 0;
  F.elev.rate = S.ctrl.pitch*2; F.ailL.rate = S.ctrl.roll*2; F.ailR.rate = -S.ctrl.roll*2; F.rud.rate = S.ctrl.yaw*2;
  const flapMoving = Math.abs(S.flaps.ang - S.flaps.cmd*0.32) > 0.2 && E.flapsPwr;
  F.flapPush.rate=F.flapPush2.rate = flapMoving?1:0;
}
function applyTanks(){
  ['L','R'].forEach(k=>{ const t=tanks[k], q=(k==='L'?S.fuel.qL:S.fuel.qR)/28; const lvl = t.ymin + (t.ymax-t.ymin)*Math.pow(q,0.8) + (q>0?0.004:-0.1); t.plane.constant = lvl; t.fm.visible = q>0; });
}

/* ---------- emphasis per active system ---------- */
function applyEmphasis(){
  const sys=S.sys, all=sys==='overview';
  const dark=isDark();
  shellUniforms.uColor.value.set(css('--shell'));
  shellUniforms.uOpacity.value = S.xray ? (dark?0.55:0.6) : 1;
  parts.forEach(p=>{
    const o=p.obj; if(!o.isMesh) return;
    if(p.shell){
      const active = p.ctl && !all && p.sys.some(s=>s===sys);
      if(active) o.material = mats(p.color).hi;
      else o.material = S.xray ? shellMat : (o.userData.skin ? skinMat : solidMat);
      o.renderOrder = S.xray ? 2 : 0;
      return;
    }
    if(o.userData.screen) return;
    if(o.userData.tank){ o.material.opacity = (all||sys==='fuel')?0.14:0.05; return; }
    const act = all || p.sys.includes(sys);
    const col = o.userData.col || p.color;
    const focus = S.focus && S.focus===p.name;
    if(o.userData.plate){ o.material = act ? plateMat.on : plateMat.dim; return; }
    o.material = focus ? mats(col).hi : (act || !S.xray) ? mats(col).on : mats(col).dim;
  });
  flows.forEach(f=>{ if(f.tube){ const act=all||f.sys.includes(sys); f.tube.material = (act||!S.xray)?mats(f.color).on:mats(f.color).dim; } });
  outlineMat.color.set(S.xray ? css('--shell') : '#10171C'); outlineMat.opacity = S.xray ? 0.75 : 0.9;
  ['L','R'].forEach(k=>tanks[k].fm.material.opacity = (all||sys==='fuel')?0.62:0.12);
  const lightSys = all||sys==='lighting';
  [navL,navR,navT].forEach(s=>s.visible=lightSys && E.navPwr);
}
function isDark(){ const t=document.documentElement.getAttribute('data-theme'); return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  scene.background = new T.Color(css('--scene'));
  grid.material.color.set(css('--grid'));
  // theme-dependent part colours (airframe, cabin, gear) re-read from CSS tokens
  parts.forEach(p=>{ const v=p.obj.userData&&p.obj.userData.colVar; if(v){ const c=css(v); p.obj.userData.col=c; p.color=c; } });
  flows.forEach(f=>{ if(f.colVar){ f.color=css(f.colVar); if(f.tube) f.tube.userData.col=f.color; } });
  applyEmphasis(); buildPins();
}

/* ---------- labels ---------- */
let pins=[];
function buildPins(){
  const layer=$('labels'); layer.innerHTML=''; pins=[];
  if(!S.labels || S.sys==='overview') return;
  const seen=new Set();
  parts.filter(p=>p.pin && p.sys.includes(S.sys) && p.name).forEach(p=>{
    if(seen.has(p.name)) return; seen.add(p.name);
    const el=h('div',{class:'pin',style:`--c:${sysColor(S.sys)}`}); el.textContent=p.name; layer.append(el);
    pins.push({el,p});
  });
  if(S.sys==='overview') return;
}
const tmpV=new T.Vector3();
function updatePins(){
  const W=stage.clientWidth, H=stage.clientHeight;
  pins.forEach(({el,p})=>{
    p.obj.getWorldPosition(tmpV);
    if(p.obj.geometry){ if(!p.obj.geometry.boundingSphere) p.obj.geometry.computeBoundingSphere(); tmpV.copy(p.obj.geometry.boundingSphere.center); p.obj.localToWorld(tmpV); }
    tmpV.project(camera);
    const vis = tmpV.z<1 && tmpV.z>-1 && Math.abs(tmpV.x)<1.05 && Math.abs(tmpV.y)<1.05;
    el.hidden=!vis; if(!vis) return;
    el.style.transform=`translate(${(tmpV.x*0.5+0.5)*W}px,${(-tmpV.y*0.5+0.5)*H}px) translate(-50%,-100%)`;
  });
}

/* ---------- camera flight ---------- */
let flight=null;
function flyTo(v){
  const to={p:V(...v.p), t:V(...v.t)};
  if(reduceMotion){ camera.position.copy(to.p); controls.target.copy(to.t); return; }
  flight={from:{p:camera.position.clone(), t:controls.target.clone()}, to, t0:performance.now(), dur:1000};
}
controls.addEventListener('start',()=>{ flight=null; });
const CAPS_CAM={p:[20,9,26],t:[0,6,0]};
function focusPart(p){
  S.focus=p.name; applyEmphasis();
  const c=new T.Vector3(); p.obj.getWorldPosition(c);
  if(p.obj.geometry){ p.obj.geometry.computeBoundingSphere(); c.copy(p.obj.geometry.boundingSphere.center); p.obj.localToWorld(c); }
  const dir=camera.position.clone().sub(controls.target).normalize();
  flyTo({p:c.clone().add(dir.multiplyScalar(2.6)).toArray(), t:c.toArray()});
  clearTimeout(focusPart._t); focusPart._t=setTimeout(()=>{ S.focus=null; applyEmphasis(); }, 2600);
}

/* ---------- hover tooltip ---------- */
const ray=new T.Raycaster(), mouse=new T.Vector2(); let hoverReq=null, lastEvt=null;
canvas.addEventListener('pointermove',e=>{ lastEvt=e; if(!hoverReq) hoverReq=requestAnimationFrame(doHover); });
canvas.addEventListener('pointerleave',()=>{ $('tip').hidden=true; });
function doHover(){
  hoverReq=null; const e=lastEvt; if(!e || e.buttons){ $('tip').hidden=true; return; }
  const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const cand=pickables.filter(m=>m.visible && (S.sys==='overview' || m.userData.part.sys.includes(S.sys) || m.userData.part.shell));
  const hits=ray.intersectObjects(cand,false);
  let hit=hits.find(x=>!x.object.userData.part.shell) || hits[0];
  const tip=$('tip');
  if(!hit || !hit.object.userData.part.name){ tip.hidden=true; canvas.style.cursor=''; return; }
  const p=hit.object.userData.part;
  tip.innerHTML=`<h4 style="color:${p.shell&&!p.ctl?'var(--frame)':p.color}">${p.name}</h4>${p.note?`<p>${p.note}</p>`:''}`;
  tip.hidden=false;
  const x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  tip.style.left=Math.min(x, r.width-270)+'px'; tip.style.top=Math.min(y, r.height-tip.offsetHeight-8)+'px';
}

/* =========================================================
   SELECT / REFRESH
   ========================================================= */
function select(id, fly=true){
  S.sys=id; S.focus=null;
  document.querySelectorAll('#syslist button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));
  const s=SYS.find(x=>x.id===id);
  const inner=$('panelInner'); inner.innerHTML=''; updaters.length=0;
  inner.style.setProperty('--c',sysColor(id));
  inner.insertAdjacentHTML('beforeend',`<div class="ref"><i></i>POH §7 · p. ${s.pg}</div><h2>${s.name==='Overview'?'Airplane & Systems':s.name}</h2>`);
  const body=h('div'); inner.append(body); CONTENT[id](body);
  if(id!=='caps' && S.caps.t>=0){ S.caps.t=-1; S.caps.playing=false; resetCaps(); }
  $('capsHud').hidden = id!=='caps';
  if(fly) flyTo({p:s.cam[0], t:s.cam[1]});
  buildPins(); applyEmphasis(); refresh();
  try{ localStorage.setItem('sr20sys',id); }catch(e){}
  if(matchMedia('(max-width:860px)').matches) $('panel').scrollTop=0;
}
let lastPanelNeedsNonEss=null;
function refresh(fromSlider){
  solveElec(); applyFlows(); applyTanks(); renderCAS(); drawScreens();
  updaters.forEach(u=>u());
  if(!fromSlider && S.sys==='flaps'){ const n=E.flapsPwr; if(lastPanelNeedsNonEss!==null && n!==lastPanelNeedsNonEss){ lastPanelNeedsNonEss=n; select('flaps',false); return; } lastPanelNeedsNonEss=n; }
}

/* ---------- system list ---------- */
SYS.forEach(s=>{
  const li=h('li'); const b=h('button',{type:'button',style:`--c:${sysColor(s.id)}`},`<span class="sw"></span><span class="nm">${s.name}</span><span class="pg">${s.pg}</span>`);
  b.dataset.id=s.id; b.addEventListener('click',()=>select(s.id)); li.append(b); $('syslist').append(li);
});

/* ---------- toolbar ---------- */
$('tbXray').onclick=e=>{ S.xray=!S.xray; e.currentTarget.setAttribute('aria-pressed',S.xray); applyEmphasis(); };
$('tbLabels').onclick=e=>{ S.labels=!S.labels; e.currentTarget.setAttribute('aria-pressed',S.labels); buildPins(); };
$('tbSpin').onclick=e=>{ controls.autoRotate=!controls.autoRotate; e.currentTarget.setAttribute('aria-pressed',controls.autoRotate); };
$('tbReset').onclick=()=>{ const s=SYS.find(x=>x.id===S.sys); flyTo(S.caps.t>=0?CAPS_CAM:{p:s.cam[0],t:s.cam[1]}); };

/* =========================================================
   CAPS ANIMATION
   ========================================================= */
function resetCaps(){ root.rotation.set(0,0,0); root.position.set(1,0,0); chute.visible=false; lines.visible=false; flame.visible=false; sliderRing.visible=false; grid.visible=true; }
const capsPhases=[[0,'Handle pulled','Igniter fires the rocket'],[0.3,'Rocket extraction','Deployment bag pulled up and aft; harness strips out of the skin'],[1.6,'Lines taut','Risers and suspension lines stretched; bag releases canopy'],[2,'Inflation','Orange slider rides down the lines to meter opening; slider limits opening rate; < 3 g'],[3.6,'Nose-low hang','Rear riser snubbed short'],[8,'Snub line cut','Tail drops to ~level'],[9.8,'Descent','< 1,700 fpm, drifting with wind']];
function updateCaps(dt){
  if(S.caps.t<0){ return; }
  if(S.caps.playing){ S.caps.t = Math.min(16, S.caps.t+dt); if(S.caps.t>=16) S.caps.playing=false; updaters.forEach(u=>u()); }
  const t=S.caps.t;
  const ph=[...capsPhases].reverse().find(p=>t>=p[0]);
  $('capsT').textContent=t.toFixed(1); $('capsPhase').textContent=ph[1]; $('capsSub').textContent=ph[2];
  // aircraft attitude (degrees, + = nose up)
  let pitch=0;
  if(t<2) pitch=0; else if(t<3) pitch=lerp(0,8,(t-2)); else if(t<4.5) pitch=lerp(8,-28,(t-3)/1.5); else if(t<8) pitch=-28+Math.sin((t-4.5)*1.6)*2;
  else if(t<9.8) pitch=lerp(-28,-3,ease((t-8)/1.8)); else pitch=-3+Math.sin((t-9.8)*1.1)*2;
  root.rotation.z=pitch*D2R; root.rotation.x = t>9.8 ? Math.sin((t-9.8)*0.8)*0.04 : 0;
  grid.visible = t<1.5;
  // canister world pos
  model.updateMatrixWorld(true);
  const can=capsBox.getWorldPosition(new T.Vector3());
  const top=V(-0.3,11.5,0);  // canopy apex target (scene space)
  chute.visible=true; lines.visible=true;
  // pack / canopy
  let packPos;
  if(t<1.6){ const u=ease(clamp((t-0.3)/1.3,0,1)); packPos=can.clone().lerp(V(-2.4,9.5,0),u); }
  else packPos=V(-2.4,9.5,0).lerp(top,clamp((t-1.6)/1.2,0,1));
  packMesh.position.copy(packPos); packMesh.visible = t<2.4;
  flame.visible = t>=0.3 && t<1.5; flame.position.copy(packPos).add(V(0.3,-0.6,0)); flame.material.opacity = 0.9;
  const inf = t<2 ? 0 : clamp(ease((t-2)/1.8),0,1);
  canopy.visible = inf>0.01; canopy.position.copy(packPos).add(V(0,-1.0*inf,0));
  canopy.scale.set(0.15+0.85*inf, 0.25+0.75*inf, 0.15+0.85*inf);
  // lines
  const hp=['fwdL','fwdR','aft'].map(k=>model.localToWorld(harnessPts[k].clone()));
  const pos=lineGeo.attributes.position; let i=0;
  const rimR=5.5*Math.sin(Math.PI*0.42)*(0.15+0.85*inf), rimY=canopy.position.y+5.5*Math.cos(Math.PI*0.42)*(0.25+0.75*inf);
  const conf=V(canopy.position.x, lerp(packPos.y-1, (hp[0].y+hp[2].y)/2+3.2, inf), 0);
  for(let k=0;k<16;k++){ const a=k/16*Math.PI*2; const rp=inf>0.01?V(canopy.position.x+Math.cos(a)*rimR, rimY, Math.sin(a)*rimR):packPos; pos.setXYZ(i++,rp.x,rp.y,rp.z); pos.setXYZ(i++,conf.x,conf.y,conf.z); }
  const anchor = t<1.6 ? packPos : conf;
  hp.forEach(p=>{ pos.setXYZ(i++,p.x,p.y,p.z); pos.setXYZ(i++,anchor.x,anchor.y,anchor.z); });
  if(t<0.3){ for(let k=0;k<i;k++) pos.setXYZ(k,can.x,can.y,can.z); }
  // slider: rides down the suspension lines from the skirt toward the confluence as the canopy opens
  sliderRing.visible = t>=2 && inf>0.01;
  if(sliderRing.visible){ const u=clamp((t-2)/2.2,0,1)*0.75, y=lerp(rimY,conf.y,u), rr=Math.max(0.15,rimR*(1-u)); sliderRing.position.set(canopy.position.x,y,0); sliderRing.scale.set(rr,rr,rr); }
  pos.needsUpdate=true; lineGeo.computeBoundingSphere();
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function resize(){ const w=stage.clientWidth, hh=stage.clientHeight; renderer.setSize(w,hh,false); camera.aspect=w/Math.max(hh,1); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

let last=performance.now(), acc=0, strobeT=0, sparkT=0, dispT=0;
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(flight){ const u=clamp((now-flight.t0)/flight.dur,0,1), e=ease(u); camera.position.lerpVectors(flight.from.p,flight.to.p,e); controls.target.lerpVectors(flight.from.t,flight.to.t,e); if(u>=1) flight=null; }
  engineTick(dt);
  const prevRun=S._run; if(prevRun!==S.eng.running){ S._run=S.eng.running; refresh(); }
  // propeller
  prop.rotation.x -= (S.eng.rpm/60)*Math.PI*2*dt*(reduceMotion?0.02:0.12);
  const ba=bladeAngle()*D2R; blades.forEach(b=>b.rotation.y=ba*0.6);
  // flaps (4°/s, needs NON ESS power)
  const tgt=S.flaps.cmd*0.32;
  if(E.flapsPwr && Math.abs(S.flaps.ang-tgt)>0.01){ S.flaps.ang += Math.sign(tgt-S.flaps.ang)*Math.min(Math.abs(tgt-S.flaps.ang), 4*dt); acc+=dt; if(acc>0.25){acc=0; updaters.forEach(u=>u()); applyFlows();} }
  const fl=S.flaps.ang*D2R;
  surfaces.flapR.piv.quaternion.setFromAxisAngle(surfaces.flapR.axis, fl);
  surfaces.flapL.piv.quaternion.setFromAxisAngle(surfaces.flapL.axis, -fl);
  // controls
  const ail=S.ctrl.roll*18*D2R, el=S.ctrl.pitch*22*D2R, rud=S.ctrl.yaw*22*D2R;
  surfaces.ailR.piv.quaternion.setFromAxisAngle(surfaces.ailR.axis, -ail);
  surfaces.ailL.piv.quaternion.setFromAxisAngle(surfaces.ailL.axis, -ail);
  surfaces.elevR.piv.quaternion.setFromAxisAngle(surfaces.elevR.axis, -el);
  surfaces.elevL.piv.quaternion.setFromAxisAngle(surfaces.elevL.axis, el);
  surfaces.rudder.piv.quaternion.setFromAxisAngle(surfaces.rudder.axis, rud);
  yokes.forEach(y=>{ y.g.position.x = y.g.userData.x0 - S.ctrl.pitch*0.07; y.grip.rotation.x = S.ctrl.roll*0.6; });
  // gear
  noseCaster.rotation.y = -S.gear.diff*85*D2R;
  brakes.forEach((b,i)=>{ const amt = S.gear.park?0.6: (i===0? Math.max(0,S.gear.diff) : Math.max(0,-S.gear.diff)); b.material = amt>0.05?mats('#FF6A2A').hi:mats('#9AA3AA').on; });
  // fuel selector pointer
  selPtr.rotation.y = S.fuel.sel==='L'?Math.PI/2:S.fuel.sel==='R'?-Math.PI/2:Math.PI;
  // alt air door
  altDoor.position.x = altDoor.userData.x0 - (S.eng.altAir?0.05:0);
  // sparks
  sparkT+=dt;
  const firing = S.eng.rpm>100 && S.eng.key!=='OFF';
  plugs.forEach((pl,i)=>{ const mOn = S.eng.key==='BOTH'||S.eng.key==='START'||S.eng.key===pl.userData.mag;
    const flash = firing && mOn && (Math.sin(sparkT*18+i*1.7)>0.3);
    pl.material = (S.sys==='engine'||S.sys==='overview') && flash ? mats('#6FD8FF').hi : (S.sys==='engine'||S.sys==='overview'||S.sys==='propeller') ? mats('#DADFE2').on : mats('#DADFE2').dim; });
  [magR,magL].forEach(m=>{ const mOn = firing && (S.eng.key==='BOTH'||S.eng.key==='START'||S.eng.key===(m===magR?'R':'L')); m.material = (S.sys==='engine'||S.sys==='overview') ? (mOn?mats('#6FD8FF').on:mats('#3E4A52').on) : mats('#3E4A52').dim; });
  // alternators glow
  [[alt1M,E.alt1],[alt2M,E.alt2]].forEach(([m,up])=>{ const act=S.sys==='overview'||S.sys==='electrical'||S.sys==='engine'; m.material = !act?mats('#D9960F').dim: up?mats('#D9960F').hi:mats('#5A5040').on; });
  // stall suction marker
  const aoa=S.stall.aoa, xc=clamp(0.32-aoa/14*0.32,0,0.32);
  suction.position.copy(wingP(stallZ, xc, aoa>=14?0:1)); suction.visible = S.sys==='pitot';
  // lights
  strobeT+=dt; const st=(strobeT%1.2)<0.06;
  const lightSys=S.sys==='overview'||S.sys==='lighting';
  strobes.forEach(s=>s.visible=lightSys && E.strobePwr && st);
  const cl=cabinLit(), showCab = S.sys==='lighting';
  cabinLights.dome.visible=showCab&&!!cl.dome; cabinLights.bag.visible=showCab&&!!cl.bag;
  cabinLights.foot.forEach(s=>s.visible=showCab&&!!cl.foot); cabinLights.step.forEach(s=>s.visible=showCab&&!!cl.step);
  // flows
  flows.forEach(f=>f.update(dt));
  // CAPS
  if(S.sys==='caps') updateCaps(dt);
  // displays at 5 Hz
  dispT+=dt; if(dispT>0.2){ dispT=0; drawScreens(); if(S.sys==='engine'||S.sys==='propeller'||S.sys==='fuel') updaters.forEach(u=>u()); }
  controls.update();
  renderer.render(scene,camera);
  updatePins();
  requestAnimationFrame(tick);
}

/* ---------- theme sync ---------- */
new MutationObserver(()=>{ applyTheme(); syncThemeBtn(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
/* ---------- light / dark toggle ---------- */
const SUN='<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/>',
      MOON='<path d="M13.5 10.2A5.8 5.8 0 0 1 5.8 2.5a5.8 5.8 0 1 0 7.7 7.7z"/>';
function syncThemeBtn(){ const d=isDark(), b=$('tbTheme'); b.querySelector('.ico').innerHTML=d?SUN:MOON; b.querySelector('span').textContent=d?'Light':'Dark'; b.title=d?'Switch to light mode':'Switch to dark mode'; }
$('tbTheme').onclick=()=>{ const t=isDark()?'light':'dark'; document.documentElement.setAttribute('data-theme',t); try{ localStorage.setItem('sr20theme',t); }catch(e){} };
try{ const t=localStorage.getItem('sr20theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
syncThemeBtn();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ applyTheme(); syncThemeBtn(); });

/* ---------- boot ---------- */
let start='overview';
const hash=location.hash.replace('#',''); if(SYS.some(s=>s.id===hash)) start=hash;
else { try{ const st=localStorage.getItem('sr20sys'); if(st && SYS.some(s=>s.id===st)) start=st; }catch(e){} }
S._run=S.eng.running;
solveElec(); applyTheme();
select(start,false);
const s0=SYS.find(x=>x.id===start); camera.position.set(...s0.cam[0]); controls.target.set(...s0.cam[1]);
requestAnimationFrame(tick);
})();
</script>
